name: Web UI image

on:
  push:
    branches: [main]
    paths:
      - web-ui/**
      # The web UI imports the API's schemas, so it is rebuilt when they change
      - api/schemas.ts
      - .github/workflows/web-ui-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ui-image
  cancel-in-progress: true

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/comp3006-web-ui

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - id: platform
        run: echo "pair=$(echo ${{ matrix.platform }} | tr / -)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          # Built from the repo root, as the web UI imports the API's schemas
          context: .
          file: web-ui/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Each platform keeps its own cache so they do not overwrite each other
          cache-from: type=gha,scope=web-ui-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=web-ui-${{ steps.platform.outputs.pair }}

      - run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-platform images into one multi-arch image and tags it
  merge:
    runs-on: ubuntu-24.04-arm
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: version
        run: echo "version=$(jq -r .version web-ui/package.json)" >> "$GITHUB_OUTPUT"

      # Tags the image as `latest`, the package.json version and the short commit SHA
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=latest

      - working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
