name: Web UI image

on:
  push:
    branches: [main]
    paths:
      - web-ui/**
      # The web UI imports the API's schemas, so it is rebuilt when they change
      - api/schemas.ts
      - .github/workflows/web-ui-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ui-image
  cancel-in-progress: true

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/comp3006-web-ui

jobs:
  build-and-push:
    runs-on: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      # Emulates arm64 so the amd64 runner can build both platforms
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: version
        run: echo "version=$(jq -r .version web-ui/package.json)" >> "$GITHUB_OUTPUT"

      # Tags the image as `latest`, the package.json version and the short commit SHA
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          # Built from the repo root, as the web UI imports the API's schemas
          context: .
          file: web-ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
