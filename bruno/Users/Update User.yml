info:
  name: Update User
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/users/:userId"
  params:
    - name: userId
      value: "{{userId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "displayName": "Bob"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
