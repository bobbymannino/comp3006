info:
  name: Get Post
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/posts/:postId"
  params:
    - name: postId
      value: "{{postId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
