info:
  name: Update Post
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/posts/:postId"
  params:
    - name: postId
      value: "{{postId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "title": "Updated Post",
        "published": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
