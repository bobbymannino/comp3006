info:
  name: Signup
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/signup"
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "email": "{{email}}",
        "displayName": "Bob",
        "password": "{{password}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status == 201) {
          bru.setVar("userId", res.body._id);
          bru.setVar("token", res.body.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
