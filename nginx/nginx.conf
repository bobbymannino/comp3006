upstream api {
  server api:3001;
}

# This basically says a new "service" called `web_ui` and point it to the
# `web-ui` container on port `3000`. The `api` service above is the same but
# obviously points to the API container.
upstream web_ui {
  server web-ui:3000;
}

# Only send `Connection: upgrade` when the browser asked for a WebSocket, so
# normal requests can still keep their connection to the upstream open. Create a
# new variable `connection_upgrade` that is either `upgrade` or `""` depending
# on the `$http_upgrade` variable.
map $http_upgrade $connection_upgrade {
  default upgrade; # If it has any value, set it to "upgrade"
  ""      ""; # If it has no value, set it to ""
}

server {
  listen 80;
  server_name _;

  # Room for long posts in request bodies (1MB).
  client_max_body_size 1m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # This passes any requests that are under /api (e.g. GET /api/posts) to the
  # api container.
  location /api/ {
    proxy_pass http://api;

    # Pass WebSocket upgrades through for the live posts feed
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # The live feed can sit idle for a while, so do not close it after the
    # default 60s
    proxy_read_timeout 1h;
  }

  # Pass all requests to the web UI container.
  location / {
    proxy_pass http://web_ui;
  }
}
